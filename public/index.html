<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitChat - Voice Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans flex justify-center items-center h-screen overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col justify-between p-6 max-w-md mx-auto">
        <div class="text-center mt-16">
            <div class="inline-block p-4 bg-gradient-to-tr from-pink-600 to-purple-600 rounded-3xl mb-4 shadow-xl">
                <i class="fa-solid fa-comments text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-pink-500">ChitChat</h1>
            <p class="text-gray-400 text-sm mt-1">Voice Club & Admin App</p>
        </div>
        <div class="space-y-4 w-full">
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें..." class="w-full py-3.5 px-4 bg-gray-900 border border-gray-700 rounded-2xl text-sm focus:outline-none text-white">
            <button onclick="loginUser()" class="w-full py-3.5 bg-gradient-to-r from-pink-600 to-purple-600 rounded-2xl font-bold shadow-lg">लॉगिन करें 🚀</button>
        </div>
        <p class="text-center text-xs text-gray-500">Version 2026</p>
    </div>

    <!-- MAIN HOME PAGE -->
    <div id="mainApp" class="hidden flex flex-col h-full w-full max-w-md bg-gray-900 shadow-2xl relative">
        <!-- Top Navbar -->
        <div class="flex items-center justify-between p-4 bg-gray-900 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-pink-600 flex items-center justify-center font-bold text-sm shadow" id="userAvatar">U</div>
                <div>
                    <h3 class="font-bold text-pink-500 text-sm" id="displayUsername">User</h3>
                    <span class="text-[10px] text-green-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[6px]"></i> Online</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="bg-gray-800 px-3 py-1 rounded-full text-xs font-bold text-yellow-400 border border-gray-700">
                    <i class="fa-solid fa-coins"></i> <span id="coinBalance">1000</span>
                </button>
                <!-- LOGOUT BUTTON -->
                <button onclick="logoutUser()" title="लॉगआउट" class="bg-red-600/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-xl text-xs font-bold hover:bg-red-600 hover:text-white transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <!-- Home Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-gradient-to-r from-pink-900/40 to-purple-900/40 p-4 rounded-2xl border border-pink-700/50">
                <h2 class="font-bold text-pink-400 text-sm">🔥 Official ChitChat Lounge</h2>
                <p class="text-xs text-gray-300 mt-1">अपने दोस्तों के साथ वॉइस चैट करने के लिए नीचे रूम जॉइन करें।</p>
            </div>

            <div class="bg-gray-800/60 p-4 rounded-2xl border border-gray-700 flex justify-between items-center shadow">
                <div>
                    <h3 class="font-bold text-sm">9-Seat Voice Club</h3>
                    <p class="text-xs text-gray-400">Active: Live Lounge</p>
                </div>
                <button onclick="openVoiceRoom()" class="bg-pink-600 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">रूम में जाएँ</button>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="flex justify-around items-center p-3 bg-gray-900 border-t border-gray-800 text-xs">
            <button onclick="switchTab('home')" class="text-pink-500 flex flex-col items-center"><i class="fa-solid fa-house text-base"></i>Home</button>
            <button onclick="switchTab('messages')" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-message text-base"></i>Messages</button>
            <button onclick="switchTab('profile')" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-user text-base"></i>Profile</button>
        </div>

        <!-- VOICE ROOM MODAL -->
        <div id="viewVoiceRoom" class="hidden absolute inset-0 bg-gray-900 z-30 flex flex-col p-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <button onclick="closeVoiceRoom()" class="text-gray-400 text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> होम पर वापस जाएँ</button>
                <h2 class="text-sm font-bold text-pink-400">9-Seat Voice Club</h2>
            </div>
            <div id="seatsGrid" class="grid grid-cols-3 gap-4 py-6"></div>
            
            <div class="text-[11px] text-gray-400 mb-1 font-semibold">Live Club Chat:</div>
            <div id="chatLog" class="flex-1 overflow-y-auto space-y-2 text-xs my-2 bg-gray-950/60 p-3 rounded-xl border border-gray-800"></div>
            
            <div class="flex items-center gap-2 pt-2">
                <input type="text" id="messageInput" placeholder="संदेश भेजें..." class="flex-1 bg-gray-800 border border-gray-700 rounded-full px-4 py-2.5 text-xs text-white focus:outline-none">
                <button onclick="sendMessage()" class="bg-pink-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane text-xs"></i></button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = localStorage.getItem('chitchat_user') || "";

        // Auto Login Check
        window.onload = () => {
            if (myName) {
                document.getElementById('usernameInput').value = myName;
                loginUser();
            }
        };

        function loginUser() {
            const val = document.getElementById('usernameInput').value.trim();
            if (!val) return alert("कृपया अपना नाम लिखें!");
            
            myName = val;
            localStorage.setItem('chitchat_user', myName);

            document.getElementById('displayUsername').innerText = myName;
            document.getElementById('userAvatar').innerText = myName.charAt(0).toUpperCase();

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            socket.emit('join_room', { name: myName });
        }

        function logoutUser() {
            if (confirm("क्या आप लॉगआउट करना चाहते हैं?")) {
                localStorage.removeItem('chitchat_user');
                location.reload();
            }
        }

        function openVoiceRoom() { document.getElementById('viewVoiceRoom').classList.remove('hidden'); }
        function closeVoiceRoom() { document.getElementById('viewVoiceRoom').classList.add('hidden'); }

        function switchTab(tab) {
            if (tab === 'messages') {
                alert("Personal Messages सेक्शन जल्द ही उपलब्ध होगा!");
            } else if (tab === 'profile') {
                alert("प्रोफ़ाइल: " + myName + "\nCoins: 1000");
            }
        }

        socket.on('init_room', (data) => { renderSeats(data.seats); });
        socket.on('update_seats', (seats) => { renderSeats(seats); });

        function renderSeats(seats) {
            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
            seats.forEach((seat, index) => {
                let cls = "w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center cursor-pointer shadow";
                let content = `<i class="fa-solid fa-lock text-gray-500 text-xs"></i>`;
                let name = `${index + 1}`;
                if (seat) {
                    cls = "w-14 h-14 rounded-full bg-gray-800 border-2 border-pink-500 flex items-center justify-center cursor-pointer shadow-lg";
                    content = `<i class="fa-solid fa-microphone text-pink-400 text-xs"></i>`;
                    name = seat.name;
                }
                grid.innerHTML += `<div class="flex flex-col items-center" onclick="toggleSeat(${index})"><div class="${cls}">${content}</div><span class="text-[10px] mt-1 text-gray-300 truncate w-14 text-center">${name}</span></div>`;
            });
        }

        function toggleSeat(index) { socket.emit('toggle_seat', { seatIndex: index }); }
        
        function sendMessage() {
            const inp = document.getElementById('messageInput');
            if (inp.value.trim()) { 
                socket.emit('send_message', { text: inp.value }); 
                inp.value = ''; 
            }
        }

        socket.on('wallet_update', (wallet) => { document.getElementById('coinBalance').innerText = wallet.coins; });
        
        socket.on('chat_message', (data) => {
            const log = document.getElementById('chatLog');
            log.innerHTML += `<div class="bg-gray-800/40 p-2 rounded"><span class="font-bold text-pink-400">${data.sender}:</span> ${data.text}</div>`;
            log.scrollTop = log.scrollHeight;
        });
    </script>
</body>
</html>
