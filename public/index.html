<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitChat - Admin Panel Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-gray-900 p-4 rounded-2xl border border-gray-800">
            <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> ChitChat Super Admin Control Panel</h1>
            <button onclick="fetchAdminData()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold">रिफ्रेश डेटा</button>
        </div>

        <!-- Live Metrics -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800"><p class="text-xs text-gray-400">एक्टिव लाइव रूम्स</p><h2 id="totalRooms" class="text-2xl font-bold text-pink-500">1</h2></div>
            <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800"><p class="text-xs text-gray-400">कुल लाइव यूज़र्स</p><h2 id="totalUsers" class="text-2xl font-bold text-yellow-400">0</h2></div>
            <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800"><p class="text-xs text-gray-400">सिस्टम स्टेटस</p><h2 class="text-2xl font-bold text-green-400">ऑनलाइन 🟢</h2></div>
        </div>

        <!-- Active Rooms & 9-Seat Controls -->
        <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-4">
            <h3 class="font-bold text-sm text-gray-300">रूम एवं सीट मॉनिटरिंग (Seat Locking & Kick Control)</h3>
            <div id="roomsContainer" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const socket = io();

        async function fetchAdminData() {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            
            document.getElementById('totalRooms').innerText = data.activeRooms;
            document.getElementById('totalUsers').innerText = data.totalUsers;

            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';

            Object.keys(data.roomsData).forEach(roomId => {
                const room = data.roomsData[roomId];
                container.innerHTML += `
                    <div class="bg-gray-800/40 p-4 rounded-xl border border-gray-700 space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-sm">${room.name} (${room.id})</h4>
                            <span class="text-xs text-gray-400">9 Seats Grid</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs">
                            ${room.seats.map((s, idx) => `
                                <div class="bg-gray-900 p-2 rounded-lg border border-gray-800 flex justify-between items-center">
                                    <span>Seat #${idx+1}: ${s ? s.name : 'Empty'}</span>
                                    ${s ? `<button onclick="kickSeat(${idx})" class="text-red-400 font-bold px-2">Kick</button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
        }

        function kickSeat(seatIndex) {
            socket.emit('admin_action', { action: 'kick_seat', seatIndex });
            setTimeout(fetchAdminData, 500);
        }

        fetchAdminData();
    </script>
</body>
</html>
