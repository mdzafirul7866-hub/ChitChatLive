<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitChat Live - VIP Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0b16; color: #fff; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: #151528; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 70px; }
        .screen.active { display: flex; }

        .login-box { position: absolute; inset: 0; background: #121222; z-index: 200; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222238; color: #fff; outline: none; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00e676; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .nav-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #1e1e38; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 100; }
        .nav-item { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #00e676; }

        .p-15 { padding: 15px; }
        .card { background: #222238; padding: 15px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; border-left: 4px solid #ffd700; }

        /* VIP Avatar Frame Effect */
        .avatar-frame { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #ffd700; display: flex; align-items: center; justify-content: center; background: #333; position: relative; font-weight: bold; }
        .vip-badge { position: absolute; bottom: -4px; right: -4px; background: #ff4081; font-size: 9px; padding: 2px 5px; border-radius: 10px; color: #fff; }

        /* Chat Bubbles Style */
        .chat-bubble { background: linear-gradient(135deg, #6200ea, #b388ff); padding: 8px 12px; border-radius: 15px; margin: 4px 0; font-size: 13px; max-width: 80%; }

        .seats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 15px; }
        .seat { height: 75px; border-radius: 8px; background: #222238; border: 2px dashed #444; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .seat.occupied { border: 2px solid #ffd700; background: #282848; }
        .seat.talking { border: 2px solid #00e676; box-shadow: 0 0 10px #00e676; }

        .ptt-container { text-align: center; padding: 10px; display: none; }
        .ptt-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: #e91e63; color: white; font-weight: bold; cursor: pointer; user-select: none; }

        /* Gift Animation Popup */
        .gift-popup { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; display: none; animation: popAnim 1.5s ease-out forwards; z-index: 300; pointer-events: none; }
        @keyframes popAnim { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.3); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.3); } 100% { opacity:0; transform:translate(-50%,-50%) scale(1); } }

        .admin-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); padding: 20px; z-index: 150; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- LOGIN SCREEN (Auto-saved session, no repeated OTP) -->
    <div class="login-box" id="loginScreen">
        <h2>🚀 ChitChat Live - VIP Login</h2>
        <input type="text" id="phoneInput" class="input-field" placeholder="मोबाइल नंबर">
        <input type="text" id="usernameInput" class="input-field" placeholder="आपका नाम">
        <select id="vipSelect" class="input-field">
            <option value="1">VIP Level 1 (Bronze)</option>
            <option value="2">VIP Level 2 (Silver)</option>
            <option value="3">VIP Level 3 (Gold)</option>
            <option value="5" selected>VIP Level 5 (Royal King 👑)</option>
        </select>
        <button class="btn" onclick="loginApp()">ऐप में प्रवेश करें</button>
    </div>

    <!-- 1. HOME SCREEN -->
    <div class="screen active" id="screenHome">
        <div class="p-15">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🏠 होम - लाइव रूम्स</h3>
                <div style="font-size:13px; color:#ffd700;">🪙 <span id="walletCoins">10000</span></div>
            </div>
            <div style="margin-top: 15px;">
                <div class="card" onclick="joinRoom('room_1')">
                    <h4>🔥 VIP PTT Party Room 103</h4>
                    <p style="font-size:11px; color:#aaa;">15s होल्ड माइक सिस्टम | वीआईपी रूम</p>
                </div>
                <div class="card" onclick="joinRoom('room_2')">
                    <h4>📞 Family Open Lounge</h4>
                    <p style="font-size:11px; color:#aaa;">नॉर्मल ओपन कॉल (10 सीट्स)</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ACTIVE ROOM SCREEN -->
    <div class="screen" id="screenRoom">
        <div class="p-15" style="display:flex; justify-content:space-between; align-items:center; background:#1e1e38;">
            <h4 id="roomHeaderTitle">Room</h4>
            <div>
                <button onclick="openAdmin()" style="background:#ff9800; border:none; padding:5px 8px; border-radius:5px; color:#fff; cursor:pointer;">Admin</button>
                <button onclick="switchScreen('screenHome')" style="background:#ff5252; border:none; padding:5px 8px; border-radius:5px; color:#fff; cursor:pointer;">Exit</button>
            </div>
        </div>

        <!-- 10 Seats -->
        <div class="seats-grid" id="seatsGrid"></div>

        <!-- PTT Button -->
        <div class="ptt-container" id="pttContainer">
            <button class="ptt-btn" id="pttBtn">HOLD<br>(15s)</button>
            <p id="timerTxt" style="font-size:11px; color:#ffeb3b; margin-top:5px;">माइक होल्ड करें</p>
        </div>

        <!-- Live Chat Box with Bubbles -->
        <div style="flex:1; background:#12121c; padding:10px; overflow-y:auto;" id="chatBox"></div>

        <!-- Controls & Gift Drawer -->
        <div style="padding:10px; background:#1e1e38; display:flex; gap:5px;">
            <input type="text" id="chatInput" class="input-field" style="margin:0;" placeholder="चैट करें...">
            <button onclick="sendChat()" style="background:#00e676; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">Send</button>
            <button onclick="sendGift('rocket')" style="background:#ff4081; border:none; padding:8px 10px; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;">🎁 गिफ्ट</button>
        </div>
    </div>

    <!-- 3. PROFILE SCREEN -->
    <div class="screen" id="screenProfile">
        <div class="p-15" style="text-align:center;">
            <div style="width:70px; height:70px; border-radius:50%; border:3px solid #ffd700; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:24px;" id="profileAvatar">👑</div>
            <h3 id="profileName" style="margin-top:10px;">User</h3>
            <p style="font-size:12px; color:#ffd700;" id="profileVip">VIP Level 5</p>
        </div>
    </div>

    <!-- GIFT POPUP ANIMATION -->
    <div class="gift-popup" id="giftPopup">🚀</div>

    <!-- ADMIN MODAL -->
    <div class="admin-modal" id="adminModal">
        <h3>Admin Access Panel</h3>
        <input type="password" id="adminPassInput" class="input-field" placeholder="पासवर्ड">
        <button class="btn" onclick="loginAdmin()">लॉगिन</button>
        <button class="btn" style="background:#555; color:#fff;" onclick="closeAdmin()">बंद करें</button>
        <div id="adminStatus" style="margin-top:10px; color:#00e676; display:none;">एडमिन एक्टिव! सीट पर क्लिक करके किक करें।</div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('screenHome', this)">🏠 होम</button>
        <button class="nav-item" onclick="switchTab('screenProfile', this)">👑 प्रोफाइल</button>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let localUser = null;
    let currentRoomType = "";
    let pttTimer = null;
    let pttSecondsLeft = 15;
    let isHoldingMic = false;
    let isAdminLoggedIn = false;

    // Check Local Storage Session (No repeated OTP)
    window.onload = () => {
        const saved = localStorage.getItem('chitchat_user');
        if (saved) {
            localUser = JSON.parse(saved);
            initUserSession();
        }
    };

    async function loginApp() {
        const phone = document.getElementById('phoneInput').value;
        const username = document.getElementById('usernameInput').value;
        const vipLevel = document.getElementById('vipSelect').value;
        if (!phone) return alert("नंबर डालें!");

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone, username, vipLevel })
        });
        const d = await res.json();
        if (d.success) {
            localUser = d.user;
            localStorage.setItem('chitchat_user', JSON.stringify(localUser));
            initUserSession();
        }
    }

    function initUserSession() {
        document.getElementById('loginScreen').style.display = 'none';
        socket.emit('join_app', localUser);
        document.getElementById('profileName').innerText = localUser.name;
        document.getElementById('profileVip').innerText = `VIP Level ${localUser.vipLevel} 👑`;
        document.getElementById('walletCoins').innerText = localUser.coins;
    }

    function switchTab(screenId, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        btn.classList.add('active');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function joinRoom(roomId) {
        socket.emit('join_room', roomId);
        switchScreen('screenRoom');
    }

    socket.on('room_info', (room) => {
        currentRoomType = room.type;
        document.getElementById('roomHeaderTitle').innerText = room.title;
        document.getElementById('pttContainer').style.display = room.type === 'ptt' ? 'block' : 'none';
    });

    socket.on('update_seats', (seats) => {
        const grid = document.getElementById('seatsGrid');
        grid.innerHTML = '';
        seats.forEach((seat, idx) => {
            const el = document.createElement('div');
            el.className = `seat ${seat ? 'occupied' : ''} ${seat && seat.isTalking ? 'talking' : ''}`;
            el.onclick = () => {
                if (isAdminLoggedIn) socket.emit('admin_kick_seat', idx);
                else seat ? socket.emit('leave_seat') : socket.emit('take_seat', {seatIndex: idx});
            };
            el.innerHTML = `
                <div class="avatar-frame">
                    ${seat ? seat.name.charAt(0) : '🪑'}
                    ${seat ? `<span class="vip-badge">V${seat.vipLevel}</span>` : ''}
                </div>
                <div style="font-size:8px; margin-top:2px;">${seat ? seat.name : 'Seat '+(idx+1)}</div>
            `;
            grid.appendChild(el);
        });
    });

    // PTT 15s Logic
    const pttBtn = document.getElementById('pttBtn');
    const timerTxt = document.getElementById('timerTxt');

    function startTalking(e) {
        if(e) e.preventDefault();
        if(currentRoomType !== 'ptt' || isHoldingMic) return;
        isHoldingMic = true;
        pttSecondsLeft = 15;
        socket.emit('start_talking');
        pttBtn.style.background = "#00e676";
        timerTxt.innerText = `${pttSecondsLeft}s`;

        pttTimer = setInterval(() => {
            pttSecondsLeft--;
            timerTxt.innerText = `${pttSecondsLeft}s`;
            if(pttSecondsLeft <= 0) { stopTalking(); timerTxt.innerText = "समय समाप्त!"; }
        }, 1000);
    }

    function stopTalking(e) {
        if(e) e.preventDefault();
        if(currentRoomType !== 'ptt' || !isHoldingMic) return;
        isHoldingMic = false;
        clearInterval(pttTimer);
        socket.emit('stop_talking');
        pttBtn.style.background = "#e91e63";
    }

    pttBtn.addEventListener('mousedown', startTalking);
    pttBtn.addEventListener('mouseup', stopTalking);
    pttBtn.addEventListener('touchstart', startTalking);
    pttBtn.addEventListener('touchend', stopTalking);

    // Wallet & Gifts
    function sendGift(key) { socket.emit('send_gift', { giftKey: key }); }
    socket.on('update_wallet', (coins) => { document.getElementById('walletCoins').innerText = coins; });
    socket.on('gift_animation', (data) => {
        const pop = document.getElementById('giftPopup');
        pop.innerText = data.gift.icon;
        pop.style.display = 'block';
        setTimeout(() => pop.style.display = 'none', 1500);

        const box = document.getElementById('chatBox');
        box.innerHTML += `<div class="chat-bubble" style="background:#ff4081;">🎁 ${data.senderName} ने ${data.gift.name} ${data.gift.icon} भेजा!</div>`;
        box.scrollTop = box.scrollHeight;
    });

    // Chat with Bubbles
    function sendChat() {
        const input = document.getElementById('chatInput');
        if(input.value.trim()) {
            socket.emit('send_chat', input.value);
            input.value = '';
        }
    }

    socket.on('new_chat', (data) => {
        const box = document.getElementById('chatBox');
        box.innerHTML += `<div class="chat-bubble"><b>[VIP ${data.vipLevel}] ${data.sender}:</b> ${data.msg}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    function openAdmin() { document.getElementById('adminModal').style.display = 'block'; }
    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
    function loginAdmin() { socket.emit('admin_login', document.getElementById('adminPassInput').value); }
    socket.on('admin_auth_res', (d) => {
        if(d.success) { isAdminLoggedIn = true; document.getElementById('adminStatus').style.display = 'block'; alert("एडमिन ऑन!"); }
        else alert(d.msg);
    });
</script>
</body>
</html>
