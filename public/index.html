<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChitChat - Voice Club & Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans flex justify-center items-center h-dvh overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col justify-between p-6 max-w-md mx-auto">
        <div class="text-center mt-8">
            <div class="relative inline-flex items-center justify-center w-32 h-32 bg-indigo-950 rounded-[30px] mb-4 shadow-2xl border-2 border-indigo-800/50 p-3 overflow-hidden">
                <img src="/logo.png" onerror="this.style.display='none'; document.getElementById('svgLogo').classList.remove('hidden');" class="w-full h-full object-contain rounded-2xl" alt="ChitChat Logo">
                <div id="svgLogo" class="hidden flex flex-col items-center justify-center w-full h-full bg-white rounded-full p-2 text-center shadow-inner">
                    <div class="flex items-center justify-center gap-1 -mb-1">
                        <i class="fa-solid fa-comment text-sky-500 text-lg"></i>
                        <div class="bg-amber-500 text-white w-5 h-5 rounded-lg flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-microphone text-[10px]"></i>
                        </div>
                    </div>
                    <span class="text-[10px] font-black text-sky-600 tracking-tighter">Chit<span class="text-amber-500">Chat</span></span>
                </div>
            </div>
            <h1 class="text-3xl font-black tracking-wide"><span class="text-sky-400">Chit</span><span class="text-amber-500">Chat</span></h1>
            <p class="text-gray-400 text-xs mt-1">Voice Club & Live Lounge</p>
        </div>

        <div class="space-y-3.5 w-full">
            <div>
                <label class="text-xs text-gray-400 mb-1 block ml-1 font-semibold">Naam (Name):</label>
                <input type="text" id="usernameInput" placeholder="Apna naam likhein..." class="w-full py-3 px-4 bg-gray-900 border border-gray-700 rounded-2xl text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>

            <div>
                <label class="text-xs text-gray-400 mb-1 block ml-1 font-semibold">Mobile Number / Gmail ID:</label>
                <input type="text" id="userContactInput" placeholder="e.g. 9876543210 ya example@gmail.com" class="w-full py-3 px-4 bg-gray-900 border border-gray-700 rounded-2xl text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>

            <div>
                <label class="text-xs text-gray-400 mb-1 block ml-1 font-semibold">Bhasha (Language):</label>
                <select id="langSelect" class="w-full py-3 px-4 bg-gray-900 border border-gray-700 rounded-2xl text-sm text-white focus:outline-none">
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="en">English</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="bho">भोजपुरी (Bhojpuri)</option>
                </select>
            </div>

            <button onclick="loginUser()" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-amber-500 rounded-2xl font-bold shadow-lg mt-2 active:scale-98 transition text-white">Login Karein 🚀</button>
        </div>

        <p class="text-center text-xs text-gray-500 mb-2">Version 2026.3 (Multi-Room & Mic Permission)</p>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="hidden flex flex-col h-full w-full max-w-md bg-gray-900 shadow-2xl relative">
        <!-- TOP HEADER -->
        <div class="flex items-center justify-between p-3.5 bg-gray-900 border-b border-gray-800 shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-indigo-950 flex items-center justify-center border border-indigo-800 overflow-hidden">
                    <img src="/logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/134/134937.png'" class="w-full h-full object-contain" alt="Logo">
                </div>
                <div>
                    <span class="font-extrabold text-sm block leading-none"><span class="text-sky-400">Chit</span><span class="text-amber-500">Chat</span></span>
                    <span class="text-[9px] text-gray-400" id="displayContact">Contact</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button title="Notifications" class="bg-gray-800 text-amber-400 border border-gray-700 w-8 h-8 rounded-full flex items-center justify-center text-xs relative">
                    <i class="fa-solid fa-bell"></i>
                    <span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>

                <div class="flex items-center space-x-1.5 bg-gray-800/80 px-2.5 py-1 rounded-full border border-gray-700">
                    <div class="w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center font-bold text-[10px] text-white" id="userAvatar">U</div>
                    <span class="font-bold text-sky-400 text-xs truncate max-w-[60px]" id="displayUsername">User</span>
                </div>
                
                <button onclick="logoutUser()" title="Logout" class="bg-red-600/20 text-red-400 border border-red-500/30 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
            <div class="bg-gradient-to-r from-sky-900/40 to-amber-900/40 p-4 rounded-2xl border border-sky-700/40 shadow flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-sky-400 text-sm flex items-center gap-2"><i class="fa-solid fa-fire text-amber-500"></i> Apna Room Banao</h2>
                    <p class="text-xs text-gray-300 mt-1">Apna khud ka 9-Seat VIP Club ya Live Room shuru karein!</p>
                </div>
                <button onclick="createNewRoomPrompt()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg shrink-0">
                    <i class="fa-solid fa-plus"></i> Create Room
                </button>
            </div>

            <!-- ROOMS LIST LOBBY -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Active Rooms List</h3>
                <div id="roomsListContainer" class="space-y-3">
                    <!-- Dynamic Rooms will load here -->
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="fixed bottom-0 max-w-md w-full bg-gray-900 border-t border-gray-800 flex justify-around py-2.5 px-4 text-gray-400">
            <button class="flex flex-col items-center text-amber-500"><i class="fa-solid fa-house text-sm"></i><span class="text-[9px] mt-0.5 font-bold">Home</span></button>
            <button onclick="alert('Inbox & Messages')" class="flex flex-col items-center"><i class="fa-solid fa-comments text-sm"></i><span class="text-[9px] mt-0.5">Inbox</span></button>
            <button onclick="alert('Gifts Locker')" class="flex flex-col items-center"><i class="fa-solid fa-gift text-sm text-pink-400"></i><span class="text-[9px] mt-0.5">Gifts</span></button>
            <button onclick="alert('Profile Settings')" class="flex flex-col items-center"><i class="fa-solid fa-user text-sm"></i><span class="text-[9px] mt-0.5">Profile</span></button>
        </div>
    </div>

    <!-- 9-SEAT VOICE ROOM MODAL -->
    <div id="viewVoiceRoom" class="hidden fixed inset-0 bg-gray-950 z-50 flex flex-col p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3 shrink-0">
            <button onclick="closeVoiceRoom()" class="text-gray-400 text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Wapas</button>
            <span class="text-xs font-extrabold text-amber-500" id="activeRoomTitle">👑 9-Seat VIP Club</span>
            <div class="flex gap-2">
                <button onclick="triggerCall('Audio')" title="Audio Call" class="bg-green-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow"><i class="fa-solid fa-phone"></i></button>
                <button onclick="triggerCall('Video')" title="Video Call" class="bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>
        
        <div id="seatsGrid" class="grid grid-cols-3 gap-3 py-4"></div>

        <div class="flex justify-between items-center bg-gray-900 p-2.5 rounded-2xl border border-gray-800 mb-2 shrink-0">
            <button id="micToggleBtn" onclick="toggleMicrophone()" class="bg-gray-800 text-white border border-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-microphone-slash text-red-400" id="micIcon"></i>
                <span id="micText">Mic Off</span>
            </button>

            <button onclick="playMusic()" class="bg-gray-800 border border-gray-700 text-sky-400 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1">
                <i class="fa-solid fa-music"></i> Music
            </button>

            <button onclick="sendGift('💃 Dance')" class="bg-pink-600/30 text-pink-400 border border-pink-500/40 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Gift
            </button>
        </div>

        <div id="chatLog" class="flex-1 overflow-y-auto space-y-2 text-xs bg-gray-900/60 p-3 rounded-2xl border border-gray-800 my-1"></div>
        
        <div class="flex items-center gap-2 pt-1 shrink-0">
            <input type="text" id="messageInput" placeholder="Message likhein..." class="flex-1 bg-gray-800 border border-gray-700 rounded-full px-4 py-2.5 text-xs text-white focus:outline-none">
            <button onclick="sendMessage()" class="bg-amber-500 w-10 h-10 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane text-xs text-white"></i></button>
        </div>
    </div>

    <div id="audioContainer" class="hidden"></div>

    <script>
        const socket = io();
        let myName = localStorage.getItem('chitchat_user') || "";
        let myContact = localStorage.getItem('chitchat_contact') || "";
        let currentRoomId = null;
        let localStream = null;
        let isMicOn = false;

        const peerConnections = {};
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        window.onload = async () => {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                tempStream.getTracks().forEach(t => t.stop());
            } catch (e) {}

            if (myName && myContact) {
                document.getElementById('usernameInput').value = myName;
                document.getElementById('userContactInput').value = myContact;
                loginUser();
            }
        };

        function loginUser() {
            const nameVal = document.getElementById('usernameInput').value.trim();
            const contactVal = document.getElementById('userContactInput').value.trim();

            if (!nameVal || !contactVal) return alert("Kripya Naam aur Mobile Number/Gmail bharein!");

            myName = nameVal;
            myContact = contactVal;

            localStorage.setItem('chitchat_user', myName);
            localStorage.setItem('chitchat_contact', myContact);

            document.getElementById('displayUsername').innerText = myName;
            document.getElementById('displayContact').innerText = myContact;
            document.getElementById('userAvatar').innerText = myName.charAt(0).toUpperCase();

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            socket.emit('user_login', { name: myName, contact: myContact });
        }

        function logoutUser() {
            if (confirm("Kya aap logout karna chahte hain?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function createNewRoomPrompt() {
            let roomName = prompt("Apne naye Room ka naam likhein (e.g. Dosto Ki Mehfil):");
            if (roomName) {
                socket.emit('create_room', { roomName: roomName, hostName: myName });
            }
        }

        socket.on('room_list_update', (rooms) => {
            const container = document.getElementById('roomsListContainer');
            container.innerHTML = '';
            if (rooms.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Abhi koi room nahi hai. Upar 'Create Room' par click karke naya room banayein!</p>`;
                return;
            }
            rooms.forEach(room => {
                container.innerHTML += `
                    <div class="bg-gray-800/60 p-4 rounded-2xl border border-gray-700 flex justify-between items-center shadow">
                        <div>
                            <h3 class="font-bold text-sm text-amber-400 flex items-center gap-1.5"><i class="fa-solid fa-crown"></i> ${room.roomName}</h3>
                        <p class="text-xs text-gray-400 mt-0.5">Host: ${room.hostName} | Members: ${room.membersCount || 1}</p>
                        </div>
                        <button onclick="joinRoom('${room.id}')" class="bg-gradient-to-r from-sky-500 to-amber-500 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">Join Room</button>
                    </div>
                `;
            });
        });

        function joinRoom(roomId) {
            currentRoomId = roomId;
            socket.emit('join_specific_room', { roomId: roomId, name: myName });
            document.getElementById('viewVoiceRoom').classList.remove('hidden');
        }

        function closeVoiceRoom() {
            if (currentRoomId) {
                socket.emit('leave_room', { roomId: currentRoomId });
                currentRoomId = null;
            }
            document.getElementById('viewVoiceRoom').classList.add('hidden');
        }

        function requestSeat(index) {
            socket.emit('toggle_seat', { roomId: currentRoomId, seatIndex: index });
        }

        socket.on('room_state_update', (room) => {
            document.getElementById('activeRoomTitle').innerText = `👑 ${room.roomName}`;
            renderSeats(room.seats, room.hostName);
        });

        function renderSeats(seats, hostName) {
            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
            seats.forEach((seat, index) => {
                let cls = "w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center cursor-pointer shadow";
                let content = `<i class="fa-solid fa-lock text-gray-500 text-xs"></i>`;
                let name = `Seat ${index + 1}`;
                if (seat) {
                    cls = "w-14 h-14 rounded-full bg-amber-950 border-2 border-amber-500 flex items-center justify-center cursor-pointer shadow-lg";
                    content = `<i class="fa-solid fa-microphone text-amber-400 text-xs"></i>`;
                    name = seat.name;
                }
                grid.innerHTML += `<div class="flex flex-col items-center" onclick="requestSeat(${index})"><div class="${cls}">${content}</div><span class="text-[10px] mt-1 text-gray-300 truncate w-14 text-center">${name}</span></div>`;
            });
        }

        async function toggleMicrophone() {
            if (!isMicOn) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    isMicOn = true;
                    document.getElementById('micIcon').className = "fa-solid fa-microphone text-green-400";
                    document.getElementById('micText').innerText = "Mic On";

                    if (currentRoomId) {
                        socket.emit('start_audio_stream', { roomId: currentRoomId, socketId: socket.id, name: myName });
                    }
                } catch (err) {
                    alert("Microphone Permission Denied! Kripya Phone Settings ya App Permission se Mic Allow Karein.");
                }
            } else {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                }
                isMicOn = false;
                document.getElementById('micIcon').className = "fa-solid fa-microphone-slash text-red-400";
                document.getElementById('micText').innerText = "Mic Off";
            }
        }

        socket.on('user_joined_audio', async (data) => {
            if (data.socketId !== socket.id) {
                createPeerConnection(data.socketId, true);
            }
        });

        socket.on('webrtc_offer', async (data) => {
            const pc = createPeerConnection(data.callerId, false);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc_answer', { answer: answer, targetId: data.callerId, senderId: socket.id });
        });

        socket.on('webrtc_answer', async (data) => {
            const pc = peerConnections[data.senderId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('webrtc_ice_candidate', async (data) => {
            const pc = peerConnections[data.senderId];
            if (pc && data.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {}
            }
        });

        function createPeerConnection(targetSocketId, isOffer) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[targetSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_ice_candidate', {
                        candidate: event.candidate,
                        targetId: targetSocketId,
                        senderId: socket.id
                    });
                }
            };

            pc.ontrack = (event) => {
                let audioElem = document.getElementById(`audio_${targetSocketId}`);
                if (!audioElem) {
                    audioElem = document.createElement('audio');
                    audioElem.id = `audio_${targetSocketId}`;
                    audioElem.autoplay = true;
                    audioElem.playsInline = true;
                    document.getElementById('audioContainer').appendChild(audioElem);
                }
                audioElem.srcObject = event.streams[0];
            };

            if (isOffer) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('webrtc_offer', { offer: offer, targetId: targetSocketId, callerId: socket.id });
                });
            }

            return pc;
        }

        function triggerCall(type) { alert(`${type} Call Request Bheji Gayi!`); }
        function playMusic() { alert("🎵 Local Storage se song select karke play karein!"); }
        function sendGift(giftName) {
            if (currentRoomId) {
                socket.emit('send_room_message', { roomId: currentRoomId, text: `🎁 Animated Gift Bheja: ${giftName}` });
            }
        }

        function sendMessage() {
            const inp = document.getElementById('messageInput');
            if (inp.value.trim() && currentRoomId) { 
                socket.emit('send_room_message', { roomId: currentRoomId, text: inp.value }); 
                inp.value = ''; 
            }
        }

        socket.on('room_chat_message', (data) => {
            const log = document.getElementById('chatLog');
            log.innerHTML += `<div class="bg-gray-800/40 p-2 rounded"><span class="font-bold text-sky-400">${data.sender}:</span> ${data.text}</div>`;
            log.scrollTop = log.scrollHeight;
        });
    </script>
</body>
</html>
